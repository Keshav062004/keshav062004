<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="lang-title lang-desc">
  <title id="lang-title">Animated language mix across public repositories</title>
  <desc id="lang-desc">Primary repository languages for 18 public, non-fork repositories. JavaScript: 6 repositories; HTML: 5 repositories; Jupyter Notebook: 3 repositories; TypeScript: 2 repositories; Python: 1 repositories; Other: 1 repositories. Refreshed daily from GitHub.</desc>
  <defs>
    <linearGradient id="lang-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10070C"/>
      <stop offset="0.62" stop-color="#190B12"/>
      <stop offset="1" stop-color="#27101C"/>
    </linearGradient>
    <radialGradient id="lang-glow" cx="70%" cy="35%" r="65%">
      <stop stop-color="#C77B9B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="cx" values="62%;80%;62%" dur="8s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="lang-border" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <pattern id="lang-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E5B5C7" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="998" height="318" rx="18" fill="url(#lang-bg)" stroke="#451126"/>
  <rect x="2" y="2" width="996" height="316" rx="17" fill="url(#lang-grid)"/>
  <rect x="2" y="2" width="996" height="316" rx="17" fill="url(#lang-glow)"/>
  <path d="M48 112H568" stroke="url(#lang-border)" stroke-opacity="0.55"/>
  <text x="48" y="39" fill="#C77B9B" font-family="Consolas, monospace" font-size="10" letter-spacing="2">REPOSITORY LANGUAGE MIX</text>
  <text x="48" y="78" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">A language for every idea.</text>
  <text x="48" y="99" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="12">Primary language per public repository · refreshed daily from GitHub</text>
  <rect x="52" y="127" width="9" height="9" rx="2" fill="#E5B5C7"/><text x="72" y="137" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13">JavaScript</text><rect x="210" y="129" width="286" height="6" rx="3" fill="#27101C"/><rect x="210" y="129" width="0" height="6" rx="3" fill="#E5B5C7"><animate attributeName="width" from="0" to="95.33" dur="1.40s" begin="0.00s" fill="freeze"/></rect><text x="514" y="137" fill="#E5B5C7" font-family="Consolas, monospace" font-size="11" text-anchor="end">6 repos · 33.3%</text><rect x="52" y="152" width="9" height="9" rx="2" fill="#C77B9B"/><text x="72" y="162" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13">HTML</text><rect x="210" y="154" width="286" height="6" rx="3" fill="#27101C"/><rect x="210" y="154" width="0" height="6" rx="3" fill="#C77B9B"><animate attributeName="width" from="0" to="79.44" dur="1.52s" begin="0.10s" fill="freeze"/></rect><text x="514" y="162" fill="#E5B5C7" font-family="Consolas, monospace" font-size="11" text-anchor="end">5 repos · 27.8%</text><rect x="52" y="177" width="9" height="9" rx="2" fill="#A84D75"/><text x="72" y="187" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13">Jupyter Notebook</text><rect x="210" y="179" width="286" height="6" rx="3" fill="#27101C"/><rect x="210" y="179" width="0" height="6" rx="3" fill="#A84D75"><animate attributeName="width" from="0" to="47.67" dur="1.64s" begin="0.20s" fill="freeze"/></rect><text x="514" y="187" fill="#E5B5C7" font-family="Consolas, monospace" font-size="11" text-anchor="end">3 repos · 16.7%</text><rect x="52" y="202" width="9" height="9" rx="2" fill="#701A3D"/><text x="72" y="212" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13">TypeScript</text><rect x="210" y="204" width="286" height="6" rx="3" fill="#27101C"/><rect x="210" y="204" width="0" height="6" rx="3" fill="#701A3D"><animate attributeName="width" from="0" to="31.78" dur="1.76s" begin="0.30s" fill="freeze"/></rect><text x="514" y="212" fill="#E5B5C7" font-family="Consolas, monospace" font-size="11" text-anchor="end">2 repos · 11.1%</text><rect x="52" y="227" width="9" height="9" rx="2" fill="#B6A3AC"/><text x="72" y="237" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13">Python</text><rect x="210" y="229" width="286" height="6" rx="3" fill="#27101C"/><rect x="210" y="229" width="0" height="6" rx="3" fill="#B6A3AC"><animate attributeName="width" from="0" to="15.89" dur="1.88s" begin="0.40s" fill="freeze"/></rect><text x="514" y="237" fill="#E5B5C7" font-family="Consolas, monospace" font-size="11" text-anchor="end">1 repo · 5.6%</text><rect x="52" y="252" width="9" height="9" rx="2" fill="#451126"/><text x="72" y="262" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13">Other</text><rect x="210" y="254" width="286" height="6" rx="3" fill="#27101C"/><rect x="210" y="254" width="0" height="6" rx="3" fill="#451126"><animate attributeName="width" from="0" to="15.89" dur="2.00s" begin="0.50s" fill="freeze"/></rect><text x="514" y="262" fill="#E5B5C7" font-family="Consolas, monospace" font-size="11" text-anchor="end">1 repo · 5.6%</text>
  <circle cx="780" cy="166" r="84" fill="none" stroke="#701A3D" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="7s" repeatCount="indefinite"/>
  </circle>
