  </g>
  <circle cx="780" cy="166" r="48" fill="#10070C" fill-opacity="0.9"/>
  <text x="780" y="164" text-anchor="middle" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">18</text>
  <text x="780" y="183" text-anchor="middle" fill="#C77B9B" font-family="Consolas, monospace" font-size="8" letter-spacing="1">REPOS WITH CODE</text>
  <text x="48" y="295" fill="#C77B9B" font-family="Consolas, monospace" font-size="9" letter-spacing="1">PUBLIC REPOSITORY DATA  /  UPDATED DAILY</text>
</svg>
