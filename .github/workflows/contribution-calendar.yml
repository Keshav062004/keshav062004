name: Generate profile graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/add_contribution_calendar_labels.py
      - scripts/generate_language_card.py
      - .github/workflows/contribution-calendar.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Generate the classic snake animation
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: Keshav062004
          outputs: |
            dist/github-contribution-calendar.svg?color_snake=%23C77B9B&color_dots=%23190B12,%23451126,%23701A3D,%23A84D75,%23E5B5C7

      - name: Transfer generated file ownership to the runner
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate the animated repository-language card
        run: python scripts/generate_language_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add month and weekday labels
        run: python scripts/add_contribution_calendar_labels.py

      - name: Publish generated calendar
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
