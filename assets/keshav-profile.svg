<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="258" viewBox="0 0 1200 258" role="img" aria-labelledby="kp-title kp-desc">
  <title id="kp-title">About Keshav Gupta</title>
  <desc id="kp-desc">Computer Science Engineering graduate and software developer in Haryana, India, building full-stack products and exploring cloud and AI.</desc>
  <defs>
    <linearGradient id="kp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10070C"/>
      <stop offset="0.58" stop-color="#190B12"/>
      <stop offset="1" stop-color="#27101C"/>
    </linearGradient>
    <linearGradient id="kp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="256" rx="18" fill="url(#kp-bg)" stroke="#701A3D" stroke-opacity="0.55"/>
  <path d="M34 34V224" stroke="url(#kp-accent)" stroke-width="3"/>
  <text x="60" y="54" fill="#C77B9B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">01  /  THE BUILDER</text>
  <text x="60" y="105" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Curious by nature. Practical by design.</text>
  <text x="60" y="145" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="17">I am a Computer Science Engineering graduate and software developer based in Haryana, India.</text>
  <text x="60" y="175" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="16">I build full-stack applications and data-driven tools, with a focus on front-end craft, cloud, and AI.</text>
