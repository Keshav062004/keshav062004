    <rect x="190" width="116" height="30" rx="15" fill="#451126"/>
    <text x="248" y="20" fill="#F8F0F3" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CLOUD</text>
    <rect x="318" width="92" height="30" rx="15" fill="#451126"/>
    <text x="364" y="20" fill="#F8F0F3" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AI</text>
  </g>
  <g transform="translate(935 129)">
