<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-labelledby="kr-title kr-desc">
  <title id="kr-title">Achievements and certifications</title>
  <desc id="kr-desc">Solved over 100 LeetCode problems; open-source contributor at Hacktoberfest and Social Winter of Code; captained the university hostel cricket team to a tournament win; completed AWS Cloud Practitioner Essentials and Deloitte Data Analytics Job Simulation on Forage.</desc>
