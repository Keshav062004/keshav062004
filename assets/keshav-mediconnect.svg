<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="354" viewBox="0 0 1200 354" role="img" aria-labelledby="km-title km-desc">
  <title id="km-title">MediConnect — healthcare communication platform</title>
  <desc id="km-desc">A healthcare communication platform with role-based JWT authentication, real-time messaging and video calls, appointment booking, and Cloudinary uploads. Built with React, Redux Toolkit, Node.js, Express.js, MongoDB, JWT, and Cloudinary.</desc>
  <defs>
    <linearGradient id="km-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10070C"/>
      <stop offset="0.65" stop-color="#190B12"/>
      <stop offset="1" stop-color="#27101C"/>
    </linearGradient>
    <linearGradient id="km-screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#451126"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="352" rx="18" fill="url(#km-bg)" stroke="#701A3D" stroke-opacity="0.65"/>
  <text x="40" y="42" fill="#C77B9B" font-family="Consolas, monospace" font-size="11" letter-spacing="2">02  /  HEALTHCARE</text>
  <text x="40" y="93" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">MediConnect</text>
  <text x="40" y="126" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="16">Communication that brings care closer.</text>
  <text x="40" y="163" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="14">Role-based access, real-time messages and video calls, appointment</text>
  <text x="40" y="185" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="14">booking, and media uploads in one healthcare platform.</text>
  <g transform="translate(40 217)">
    <rect width="145" height="52" rx="10" fill="#27101C" stroke="#701A3D"/>
    <text x="16" y="24" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">JWT</text>
    <text x="16" y="41" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1">ROLE-BASED ACCESS</text>
    <rect x="157" width="178" height="52" rx="10" fill="#27101C" stroke="#701A3D"/>
    <text x="173" y="24" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">LIVE</text>
    <text x="173" y="41" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1">MESSAGING + VIDEO</text>
  </g>
  <text x="40" y="313" fill="#C77B9B" font-family="Consolas, monospace" font-size="11">REACT  /  REDUX TOOLKIT  /  NODE.JS  /  EXPRESS  /  MONGODB</text>
  <g transform="translate(788 51)">
    <rect width="349" height="242" rx="17" fill="#10070C" stroke="#451126"/>
    <rect x="16" y="18" width="317" height="206" rx="12" fill="url(#km-screen)"/>
    <circle cx="41" cy="42" r="5" fill="#C77B9B"/>
    <circle cx="58" cy="42" r="5" fill="#E5B5C7" fill-opacity="0.5"/>
    <circle cx="75" cy="42" r="5" fill="#E5B5C7" fill-opacity="0.25"/>
    <rect x="36" y="72" width="124" height="92" rx="10" fill="#451126" stroke="#C77B9B" stroke-opacity="0.55"/>
    <circle cx="98" cy="107" r="19" fill="#701A3D"/>
    <circle cx="98" cy="107" r="24" fill="none" stroke="#E5B5C7" stroke-opacity="0.7">
      <animate attributeName="r" values="22;30;22" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.65;0.1;0.65" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M70 150C74 130 122 130 126 150" fill="none" stroke="#E5B5C7" stroke-width="3" stroke-linecap="round"/>
    <rect x="177" y="72" width="137" height="14" rx="7" fill="#C77B9B" fill-opacity="0.35"/>
    <rect x="177" y="98" width="112" height="9" rx="4.5" fill="#E5B5C7" fill-opacity="0.18"/>
    <rect x="177" y="118" width="125" height="9" rx="4.5" fill="#E5B5C7" fill-opacity="0.18"/>
    <rect x="177" y="145" width="122" height="31" rx="9" fill="#701A3D"/>
    <path d="M197 161H278" stroke="#F8F0F3" stroke-opacity="0.75" stroke-width="2"/>
    <text x="35" y="207" fill="#B6A3AC" font-family="Consolas, monospace" font-size="9">CARE DASHBOARD  /  CONCEPTUAL UI</text>
