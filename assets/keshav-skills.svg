  <title id="ks-title">Technical toolkit and design skills</title>
  <desc id="ks-desc">Icon-and-name toolkit for HTML5, CSS3, JavaScript, TypeScript, React, Node.js, Tailwind CSS, Git, GitHub, MongoDB, Express.js, and PostgreSQL, followed by additional tools, engineering practices, and UI/UX design skills.</desc>
