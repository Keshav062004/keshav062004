<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="kc-title kc-desc">
  <title id="kc-title">Connect with Keshav Gupta</title>
  <desc id="kc-desc">LinkedIn, email, portfolio, and GitHub.</desc>
  <defs>
    <linearGradient id="kc-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
  </defs>
  <text x="8" y="34" fill="#C77B9B" font-family="Consolas, monospace" font-size="11" letter-spacing="2">08  /  OPEN CHANNELS</text>
  <text x="8" y="78" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Have a good problem to solve?</text>
  <text x="8" y="105" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="13">Reach me through any of the links below.</text>
  <g transform="translate(850 27)">
    <rect width="310" height="78" rx="11" fill="#10070C" stroke="#451126"/>
    <text x="14" y="17" fill="#B6A3AC" font-family="Consolas, monospace" font-size="8" letter-spacing="1">OPEN CHANNEL</text>
    <path d="M14 23H296" stroke="url(#kc-line)" stroke-opacity="0.55"/>
    <g transform="translate(16 33)">
      <rect width="52" height="36" rx="5" fill="#27101C" stroke="#701A3D"/>
      <path d="M3 5 26 21 49 5M3 5V31H49V5" fill="none" stroke="#E5B5C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 5 26 21 49 5" fill="none" stroke="#F8F0F3" stroke-width="1.6" stroke-dasharray="58" stroke-dashoffset="58">
        <animate attributeName="stroke-dashoffset" from="58" to="0" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="84" y="49" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">LET'S BUILD SOMETHING</text>
    <text x="84" y="65" fill="#C77B9B" font-family="Consolas, monospace" font-size="8" letter-spacing="0.7">EMAIL  /  LINKEDIN  /  GITHUB</text>
    <path d="M84 74H294" stroke="#451126" stroke-width="2" stroke-linecap="round"/>
    <path d="M84 74H168" stroke="url(#kc-line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="84" stroke-dashoffset="84">
      <animate attributeName="stroke-dashoffset" from="84" to="0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
