<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="kfoot-title kfoot-desc">
  <title id="kfoot-title">Thanks for visiting Keshav Gupta's profile</title>
  <desc id="kfoot-desc">Building thoughtful software, one useful iteration at a time.</desc>
  <defs>
    <linearGradient id="kfoot-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#451126"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="kfoot-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="176" rx="18" fill="url(#kfoot-bg)"/>
  <path d="M90 41H1110" stroke="url(#kfoot-path)" stroke-width="1.5"/>
  <circle cx="91" cy="41" r="3.5" fill="#C77B9B"/>
  <circle cx="1110" cy="41" r="3.5" fill="#C77B9B"/>
  <text x="600" y="95" text-anchor="middle" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Thanks for stopping by.</text>
  <text x="600" y="127" text-anchor="middle" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.2">BUILDING THOUGHTFUL SOFTWARE, ONE USEFUL ITERATION AT A TIME.</text>
  <path d="M560 148H640" stroke="#C77B9B" stroke-width="2" stroke-linecap="round" stroke-dasharray="80" stroke-dashoffset="80">
    <animate attributeName="stroke-dashoffset" from="80" to="0" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
