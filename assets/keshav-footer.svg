<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-labelledby="kf-title kf-desc">
  <title id="kf-title">Thanks for visiting</title>
  <desc id="kf-desc">A minimal burgundy footer with a softly animated accent line.</desc>
  <defs>
    <linearGradient id="kf-footer-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#451126"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="kf-footer-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="96" rx="14" fill="url(#kf-footer-bg)"/>
  <path d="M120 32H880" stroke="url(#kf-footer-line)" stroke-width="1.5"/>
  <text x="500" y="68" text-anchor="middle" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2">THANKS FOR VISITING</text>
</svg>
