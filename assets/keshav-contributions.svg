<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="kcon-title kcon-desc">
  <title id="kcon-title">Contribution graph</title>
  <desc id="kcon-desc">A genuine GitHub contribution graph for Keshav Gupta, loaded from public GitHub activity.</desc>
  <defs>
    <linearGradient id="kcon-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
  </defs>
  <text x="8" y="34" fill="#C77B9B" font-family="Consolas, monospace" font-size="11" letter-spacing="2">07  /  CONTRIBUTION MAP</text>
  <text x="8" y="78" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Consistency, one contribution at a time.</text>
  <text x="8" y="105" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="13">The graph below is sourced from the public GitHub profile.</text>
  <path d="M830 68H1190" stroke="url(#kcon-line)" stroke-width="2"/>
