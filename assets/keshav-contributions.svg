<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="kcon-title kcon-desc">
  <title id="kcon-title">Contribution graph</title>
  <desc id="kcon-desc">A genuine GitHub contribution graph for Keshav Gupta, loaded from public GitHub activity.</desc>
  <defs>
    <linearGradient id="kcon-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <pattern id="kcon-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" rx="2" fill="#451126"/>
    </pattern>
  </defs>
  <text x="8" y="34" fill="#C77B9B" font-family="Consolas, monospace" font-size="11" letter-spacing="2">07  /  CONTRIBUTION MAP</text>
  <text x="8" y="78" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Consistency, one contribution at a time.</text>
  <text x="8" y="105" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="13">The graph below is sourced from the public GitHub profile.</text>
  <g transform="translate(850 27)">
    <rect width="310" height="78" rx="11" fill="#10070C" stroke="#451126"/>
    <text x="14" y="17" fill="#B6A3AC" font-family="Consolas, monospace" font-size="8" letter-spacing="1">ACTIVITY / YEAR VIEW</text>
    <path d="M14 23H296" stroke="url(#kcon-line)" stroke-opacity="0.55"/>
    <rect x="15" y="29" width="84" height="48" fill="url(#kcon-grid)"/>
    <rect x="27" y="29" width="8" height="8" rx="2" fill="#701A3D"/>
    <rect x="63" y="29" width="8" height="8" rx="2" fill="#C77B9B"/>
    <rect x="39" y="41" width="8" height="8" rx="2" fill="#701A3D"/>
    <rect x="75" y="41" width="8" height="8" rx="2" fill="#A84D75"/>
    <rect x="51" y="53" width="8" height="8" rx="2" fill="#C77B9B"/>
    <rect x="87" y="53" width="8" height="8" rx="2" fill="#701A3D"/>
    <rect x="15" y="65" width="8" height="8" rx="2" fill="#A84D75"/>
    <rect x="63" y="65" width="8" height="8" rx="2" fill="#701A3D"/>
    <rect x="15" y="29" width="8" height="8" rx="2" fill="none" stroke="#F8F0F3" stroke-width="1.5">
      <animate attributeName="x" values="15;27;39;51;63;75;87;15" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <path d="M112 68V34M112 68H294" fill="none" stroke="#451126" stroke-width="1"/>
    <path d="M120 63H143V55H169V60H197V43H224V50H253V34H286" fill="none" stroke="#451126" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 63H143V55H169V60H197V43H224V50H253V34H286" fill="none" stroke="url(#kcon-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="210" stroke-dashoffset="210">
      <animate attributeName="stroke-dashoffset" from="210" to="0" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
