<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="142" viewBox="0 0 1200 142" role="img" aria-labelledby="kst-title kst-desc">
  <title id="kst-title">GitHub activity</title>
  <desc id="kst-desc">Live GitHub streak and language cards, followed by a real contribution graph.</desc>
  <defs>
    <linearGradient id="kst-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset="0.55" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
  </defs>
  <text x="8" y="36" fill="#C77B9B" font-family="Consolas, monospace" font-size="12" letter-spacing="2">06  /  GITHUB ACTIVITY</text>
  <text x="8" y="83" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">A live record of showing up.</text>
  <text x="8" y="111" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="14">Real contribution data from GitHub. Cards update from public profile activity.</text>
  <g transform="translate(840 32)">
    <rect width="340" height="80" rx="11" fill="#10070C" stroke="#451126"/>
    <path d="M1 22H339" stroke="url(#kst-line)" stroke-opacity="0.8"/>
    <rect x="14" y="9" width="9" height="4" rx="2" fill="#C77B9B"/>
    <rect x="28" y="9" width="9" height="4" rx="2" fill="#701A3D"/>
    <rect x="42" y="9" width="9" height="4" rx="2" fill="#451126"/>
    <text x="62" y="14" fill="#B6A3AC" font-family="Consolas, monospace" font-size="8" letter-spacing="1">DEV PROFILE / ACTIVITY</text>
    <path d="M18 39 24 44 18 49M31 49H75M18 59 24 64 18 69M31 69H92" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M111 42H307M111 56H270M111 70H291" stroke="#451126" stroke-width="5" stroke-linecap="round"/>
    <path d="M111 42H228M111 56H246M111 70H198" stroke="url(#kst-line)" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <rect x="99" y="64" width="5" height="10" fill="#E5B5C7">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
