<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="116" viewBox="0 0 1200 116" role="img" aria-labelledby="kh-title kh-desc">
  <title id="kh-title">Software developer — full-stack, AI, cloud and front-end</title>
  <desc id="kh-desc">Animated burgundy motion strip with a drawn path and soft moving glow.</desc>
  <defs>
    <linearGradient id="kh-ribbon-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.52" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="kh-ribbon-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#C77B9B" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="kh-ribbon-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E5B5C7" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="116" rx="14" fill="url(#kh-ribbon-bg)"/>
  <rect width="1200" height="116" rx="14" fill="url(#kh-ribbon-grid)"/>
  <rect width="1200" height="116" rx="14" fill="url(#kh-ribbon-light)"/>
  <circle cx="92" cy="58" r="20" fill="none" stroke="#C77B9B" stroke-opacity="0.52"/>
  <circle cx="92" cy="58" r="5" fill="#E5B5C7"/>
  <path d="M92 29V38M92 78V87M63 58H72M112 58H121" stroke="#E5B5C7" stroke-opacity="0.42"/>
  <text x="146" y="52" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">SOFTWARE DEVELOPER</text>
  <text x="146" y="79" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.5">FULL-STACK  /  AI  /  CLOUD  /  FRONT-END</text>
  <path d="M570 58H1085" fill="none" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1.5"/>
  <path d="M570 58H1085" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="515">
    <animate attributeName="stroke-dashoffset" from="515" to="0" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle cx="1110" cy="58" r="4" fill="#F8F0F3">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
