<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="kh-title kh-desc">
  <title id="kh-title">Keshav Gupta — Software Developer</title>
  <desc id="kh-desc">A dark burgundy animated hero with a subtle technical grid, orbital motif, and glowing path.</desc>
  <defs>
    <linearGradient id="kh-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.42" stop-color="#190B12"/>
      <stop offset="0.76" stop-color="#451126"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <radialGradient id="kh-hero-glow" cx="70%" cy="35%" r="62%">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animate attributeName="cx" values="68%;82%;68%" dur="16s" repeatCount="indefinite"/>
    </radialGradient>
    <pattern id="kh-hero-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity="0.075" stroke-width="0.7"/>
    </pattern>
    <filter id="kh-hero-glow-filter" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#kh-hero-bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#kh-hero-glow)"/>
  <rect width="1000" height="300" rx="18" fill="url(#kh-hero-grid)"/>
  <path d="M20 250H980" stroke="#E5B5C7" stroke-opacity="0.14" stroke-width="1"/>
  <g transform="translate(825 148)">
    <circle r="111" fill="none" stroke="#E5B5C7" stroke-opacity="0.12" stroke-width="1"/>
    <g>
      <ellipse rx="101" ry="48" transform="rotate(-27)" fill="none" stroke="#E5B5C7" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="89" cy="-23" r="4" fill="#F8F0F3"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="54s" repeatCount="indefinite"/>
    </g>
    <circle r="64" fill="none" stroke="#C77B9B" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 8"/>
    <circle cx="-91" cy="63" r="3" fill="#C77B9B" opacity="0.75"/>
  </g>
  <path d="M650 219C700 205 710 171 755 181S820 220 858 187 916 160 962 176" fill="none" stroke="#C77B9B" stroke-opacity="0.26" stroke-width="2"/>
  <path d="M650 219C700 205 710 171 755 181S820 220 858 187 916 160 962 176" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" from="360" to="0" dur="7s" repeatCount="indefinite"/>
  </path>
  <text x="74" y="130" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8">Keshav Gupta</text>
  <path d="M76 151H418" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="9" filter="url(#kh-hero-glow-filter)"/>
  <path d="M76 151H418" stroke="#E5B5C7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M76 151H418" stroke="#F8F0F3" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="342" stroke-dashoffset="342">
    <animate attributeName="stroke-dashoffset" from="342" to="0" dur="3.2s" begin="0.3s" fill="freeze"/>
  </path>
  <text x="78" y="190" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2">SOFTWARE DEVELOPER · FULL-STACK · AI · CLOUD</text>
  <text x="78" y="226" fill="#F8F0F3" fill-opacity="0.58" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.2">BUILDING USEFUL PRODUCTS WITH CODE AND CURIOSITY</text>
</svg>
